<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Haven — a calm daily workspace for creators. Milestone 1 interactive demo." />
    <meta name="theme-color" content="#f7f3ec" />
    <link rel="icon" href="/haven-mark.svg" type="image/svg+xml" />
    <title>Haven</title>
    <script>
      // Apply the last personal look on this device before first paint, so a
      // reload never flashes the wrong appearance or palette.
      (function () {
        var root = document.documentElement;
        try {
          var boot = JSON.parse(localStorage.getItem('haven.boot') || 'null');
          var stored = localStorage.getItem('haven.theme');
          var theme = boot && boot.theme
            ? boot.theme
            : stored === 'light' || stored === 'dark'
              ? stored
              : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          root.dataset.theme = theme;
          if (boot && boot.vars) {
            root.dataset.palette = boot.palette;
            for (var k in boot.vars) root.style.setProperty('--' + k, boot.vars[k]);
          }
        } catch (e) {
          root.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
